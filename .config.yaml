# 默认分类（当没有匹配关键词时使用）
default_category: "99-参考资料"

metadata:
  default_status: unread
  allowed_statuses:
    - unread      # 未阅读
    - reading     # 阅读中
    - finished    # 已读完
    - reference   # 参考书
  allowed_ratings:
    min: 1
    max: 5

display:
  table_format: pretty  # pretty | simple | grid
  max_results: 50
  show_path: true
  show_size: true

viewer:
  # 默认 PDF 阅读器
  pdf_command: open  # macOS
  # pdf_command: xdg-open  # Linux
  # pdf_command: start  # Windows
