# 书籍查询系统配置文件

# 扁平化存储配置
library_dir: library
metadata_suffix: .pdf.md
global_tags:
  - "#书籍"

database:
  path: .metadata/library.db

directories:
  base_path: books
  ignore_patterns:
    - ".scripts"
    - ".metadata"
    - ".git"
    - "venv"
    - "swap"      # 暂存/上传区，整理(organize)后才进入书库
  file_extensions:
    - ".pdf"
    - ".epub"
    - ".mobi"
    - ".djvu"
    - ".pptx"
    - ".ppt"

