<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Books Web{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="/">📚 Books Web</a>
      <nav class="nav">
        <a href="/" class="nav-item {{ 'active' if page == 'dashboard' }}">
          <span class="nav-icon">◈</span> 仪表盘
        </a>
        <a href="/library" class="nav-item {{ 'active' if page == 'library' }}">
          <span class="nav-icon">📖</span> 书库
        </a>
      </nav>
      <div class="nav-section">工具</div>
      <nav class="nav">
        <button id="btn-organize" class="nav-item">
          <span class="nav-icon">⇪</span> 整理入库
        </button>
        <button id="btn-reindex" class="nav-item">
          <span class="nav-icon">⟳</span> 重建索引
        </button>
      </nav>
      <a href="/docs" class="nav-item nav-bottom" target="_blank">
        <span class="nav-icon">&lt;/&gt;</span> API
      </a>
    </aside>

    <div class="main">
      <header class="topbar">
        <form class="global-search" action="/library" method="get">
          <span class="search-icon">⌕</span>
          <input type="search" name="keyword" placeholder="搜索书名、作者或分类"
                 value="{{ keyword or '' }}">
        </form>
        <button id="btn-upload" class="btn btn-primary">⬆ 上传</button>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <input type="file" id="upload-input" hidden
         accept=".pdf,.epub,.mobi,.djvu,.pptx,.ppt">
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js?v={{ v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
